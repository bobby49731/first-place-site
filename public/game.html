<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIRST PLACE — The Board Game</title>
<meta name="description" content="Play the First Place board game — pick your character and follow their path to the dream.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="assets/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3E6;
    --paper-2:#F5EAD8;
    --ink:#2A2033;
    --ink-soft:#6B5F71;
    --blue:#2E6FB8;
    --blue-deep:#234F86;
    --gold:#F0A82E;
    --gold-deep:#D6900F;
    --plum:#4B2E6B;
    --plum-deep:#3A2251;
    --teal:#1E8C82;
    --teal-deep:#166A62;
    --pink:#E15A87;
    --pink-deep:#C43E6A;
    --setback:#C0392B;
    --setback-deep:#96271A;
    --line: rgba(42,32,51,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  img{max-width:100%; display:block;}
  button{font-family:inherit;}

  /* MINIMAL HEADER — no full site nav here; Gear/Stories/Speaking/Join
     anchors from the main nav don't apply to this standalone page. */
  header.game-header{
    position:sticky; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 6vw;
    z-index:100;
    background:rgba(251,243,230,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .game-brand{display:flex; align-items:center; gap:10px; text-decoration:none;}
  .game-brand img{width:34px; height:34px; border-radius:50%; object-fit:cover; box-shadow:0 2px 6px rgba(0,0,0,0.15);}
  .game-brand span{font-family:'Baloo 2', sans-serif; font-weight:700; font-size:17px; color:var(--ink);}
  .game-home{
    background:var(--paper-2); border:1px solid var(--line); padding:9px 18px;
    border-radius:999px; font-weight:600; text-decoration:none; font-size:14px;
  }

  .game-wrap{max-width:1080px; margin:0 auto; padding:0 6vw 90px;}
  .game-screen{padding-top:44px;}
  .game-screen[hidden]{display:none;}

  .game-title{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(1.8rem, 4.5vw, 2.5rem);
    color:var(--plum); text-align:center;
  }
  .game-sub{max-width:560px; margin:12px auto 0; text-align:center; color:var(--ink-soft); font-size:16px;}

  /* CHARACTER SELECT */
  .char-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:20px;
    margin-top:40px; max-width:900px; margin-left:auto; margin-right:auto;
  }
  @media (max-width:760px){.char-grid{grid-template-columns:repeat(2, 1fr);}}
  .char-card{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    background:#fff; border:1px solid var(--line); border-radius:18px;
    padding:18px 14px 20px; cursor:pointer; color:inherit;
    transition:transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .char-card:hover{transform:translateY(-4px); box-shadow:0 10px 24px rgba(42,32,51,0.14); border-color:var(--gold);}
  .char-card img{width:100%; height:auto; object-fit:contain; margin-bottom:10px;}
  .char-name{font-family:'Baloo 2', sans-serif; font-weight:700; font-size:16px; color:var(--plum); margin-bottom:6px;}
  .char-dream{font-size:12.5px; color:var(--ink-soft); line-height:1.4;}

  /* Board shown small behind the character cards, present from the very
     first screen but not competing with selection for attention. */
  .select-stage{position:relative;}
  .select-board-bg{
    position:absolute;
    top:50%; left:50%; transform:translate(-50%, -50%);
    width:60%; max-width:480px;
    opacity:0.32;
    border-radius:16px;
    z-index:0;
    pointer-events:none;
  }
  .select-stage .char-grid{position:relative; z-index:1;}

  /* EMAIL GATE — same visual/interaction pattern as the shop page's
     unlock section and the homepage door/modal gates. */
  .gate-card{max-width:440px; margin:36px auto 0; text-align:center;}
  .gate-picked{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:24px;}
  .gate-picked img{width:36px; height:54px; object-fit:contain;}
  .gate-picked span{font-family:'Baloo 2', sans-serif; font-weight:700; color:var(--plum);}
  .gate-form{
    display:flex; gap:0; background:#fff; border-radius:12px; overflow:hidden; border:1px solid var(--line);
  }
  .gate-form[hidden]{display:none;}
  .gate-form input[type="email"]{
    flex:1; background:transparent; border:0; padding:15px 18px;
    color:var(--ink); font-family:'Inter', sans-serif; font-size:15px; outline:none; min-width:0;
  }
  .gate-form input[type="email"]::placeholder{color:#9A8FA6;}
  .gate-form input[type="email"].invalid{box-shadow:inset 0 0 0 2px #E0637E;}
  .gate-form button{
    background:var(--gold); color:var(--plum); border:0; padding:0 24px;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14.5px;
    cursor:pointer; transition:background 0.2s ease; white-space:nowrap;
  }
  .gate-form button:hover{background:#FFC15A;}
  .gate-form button:disabled{opacity:0.7; cursor:not-allowed;}
  .gate-message{margin-top:14px; font-size:14px; font-weight:600;}
  .gate-message.success{color:var(--teal);}
  .gate-message.error{color:var(--setback); font-weight:500; font-size:13.5px;}
  .gate-back{
    display:block; margin:20px auto 0; background:none; border:0; color:var(--ink-soft);
    font-size:13px; text-decoration:underline; cursor:pointer;
  }

  /* BOARD — the real board art as a single image, with the character's
     playing-piece token absolutely positioned on top. The board image is
     a precise 12x12 grid of 220px cells (2640px / 12); squarePosition()
     in the script below maps a square number to a (col,row) cell, so the
     same math will place the token on any square once movement exists. */
  .board-frame{
    position:relative;
    width:100%; max-width:880px; margin:36px auto 0;
    aspect-ratio:1;
  }
  .board-image{
    width:100%; height:100%;
    display:block;
    object-fit:contain;
    border-radius:16px;
    box-shadow:0 4px 18px rgba(42,32,51,0.12);
  }
  .board-token{
    position:absolute;
    width:7%;
    transform:translateX(-50%);
    z-index:5;
    pointer-events:none;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,0.35));
    transition:left 0.6s cubic-bezier(.4,0,.2,1), bottom 0.6s cubic-bezier(.4,0,.2,1);
  }
  /* The global img{display:block} reset above otherwise wins over the
     browser's default [hidden]{display:none} (author styles always beat
     UA styles, regardless of specificity) — without this, toggling
     .hidden on an <img> like #doubt-token does nothing visible. */
  .board-token[hidden]{display:none;}
  .board-token.drop-in{animation:token-drop 0.5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes token-drop{
    0%{transform:translateX(-50%) translateY(-14px) scale(0.6); opacity:0;}
    100%{transform:translateX(-50%) translateY(0) scale(1); opacity:1;}
  }
  .board-caption{
    text-align:center; margin-top:16px;
    font-size:14px; color:var(--ink-soft);
  }
  .board-caption button{
    background:none; border:0; color:var(--ink-soft);
    text-decoration:underline; cursor:pointer; font-size:14px; padding:0;
  }

  /* DICE POPPER — placeholder "Pop-O-Matic" style dice dome, built with
     plain shapes/CSS until real art exists. Mirrors the token's staging
     spot on the opposite (left) side of the board's open center area. */
  .dice-popper{
    position:absolute;
    width:15%;
    z-index:4;
    transform:translateX(-50%);
  }
  .dice-base{
    position:absolute;
    left:50%; bottom:-10%; transform:translateX(-50%);
    width:78%; height:20%;
    border-radius:50%;
    background:var(--plum-deep);
    box-shadow:0 3px 6px rgba(0,0,0,0.25);
  }
  .dice-dome{
    position:relative;
    display:block;
    width:100%; aspect-ratio:1;
    border-radius:50%;
    border:0; padding:0; cursor:pointer;
    background:
      radial-gradient(circle at 32% 24%, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 45%, rgba(190,180,210,0.12) 75%),
      rgba(255,255,255,0.18);
    box-shadow:0 6px 16px rgba(42,32,51,0.28), inset 0 -8px 16px rgba(42,32,51,0.12), inset 0 3px 6px rgba(255,255,255,0.6);
    border:2px solid rgba(255,255,255,0.75);
  }
  .dice-dome:hover{filter:brightness(1.05);}
  .dice-dome:disabled{cursor:default;}
  .die{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%, -50%);
    width:46%; aspect-ratio:1;
    background:#fff;
    border-radius:20%;
    box-shadow:0 2px 6px rgba(0,0,0,0.3);
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(3, 1fr);
    grid-template-areas:
      "tl tc tr"
      "ml mc mr"
      "bl bc br";
    padding:14%;
    gap:6%;
  }
  .die.rolling{animation:die-tumble 0.75s ease-in-out infinite;}
  @keyframes die-tumble{
    0%{transform:translate(-50%,-50%) rotate(0deg) scale(1);}
    25%{transform:translate(-58%,-58%) rotate(90deg) scale(0.92);}
    50%{transform:translate(-42%,-55%) rotate(180deg) scale(1.05);}
    75%{transform:translate(-55%,-42%) rotate(270deg) scale(0.92);}
    100%{transform:translate(-50%,-50%) rotate(360deg) scale(1);}
  }
  .pip{
    border-radius:50%;
    background:var(--ink);
    justify-self:center; align-self:center;
    width:100%; height:100%;
    opacity:0;
  }
  .pip.visible{opacity:1;}
  .pip.tl{grid-area:tl;} .pip.tc{grid-area:tc;} .pip.tr{grid-area:tr;}
  .pip.ml{grid-area:ml;} .pip.mc{grid-area:mc;} .pip.mr{grid-area:mr;}
  .pip.bl{grid-area:bl;} .pip.bc{grid-area:bc;} .pip.br{grid-area:br;}

  /* THE DOUBT'S DIE — same shapes as the player's, themed dark: a black
     die with white pips, no base glow/highlight (drained of color, per
     the design doc's visual identity for The Doubt), and not clickable
     (it rolls automatically alongside the player's roll). */
  .doubt-base{background:#2A2033;}
  .doubt-dome{
    cursor:default;
    background:
      radial-gradient(circle at 32% 24%, rgba(255,255,255,0.35), rgba(120,110,130,0.1) 45%, rgba(60,55,65,0.12) 75%),
      rgba(80,74,90,0.18);
    border-color:rgba(140,132,150,0.5);
  }
  .doubt-die{background:#241B2E;}
  .doubt-die .pip{background:#fff;}
  .doubt-token{filter:grayscale(1) drop-shadow(0 3px 6px rgba(0,0,0,0.45));}

  .click-callout{
    position:absolute;
    left:50%; top:-38%; transform:translateX(-50%);
    background:var(--gold); color:var(--plum);
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(9px, 1.5vw, 12px); letter-spacing:0.03em;
    padding:5px 12px; border-radius:999px;
    white-space:nowrap;
    box-shadow:0 3px 8px rgba(0,0,0,0.22);
    animation:callout-bounce 1.4s ease-in-out infinite;
    transition:opacity 0.3s ease;
  }
  .click-callout::after{
    content:''; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
    border-left:6px solid transparent; border-right:6px solid transparent; border-top:6px solid var(--gold);
  }
  .click-callout.hide{opacity:0; pointer-events:none;}
  @keyframes callout-bounce{
    0%, 100%{transform:translateX(-50%) translateY(0);}
    50%{transform:translateX(-50%) translateY(-4px);}
  }

  .roll-result{
    text-align:center; margin-top:18px;
    max-width:480px; margin-left:auto; margin-right:auto;
    font-size:14.5px; font-weight:600; color:var(--plum);
    background:var(--paper-2); border:1px solid var(--line);
    border-radius:12px; padding:12px 18px;
  }
  .pacing-note{
    text-align:center; margin-top:10px;
    font-size:13px; font-weight:600; color:var(--gold-deep);
  }

  /* ROOMIE WALL — replaces the mug+keys art (baked into the board
     image) once the first roll happens. Sits in the lower portion of
     the board's open center, below the logo/tagline. */
  .roomie-wall{
    position:absolute;
    left:11%; right:11%; bottom:8.5%;
    height:23%;
    background:var(--paper-2);
    border:2px solid var(--line);
    border-radius:12px;
    padding:clamp(5px, 1vw, 10px) clamp(8px, 1.4vw, 16px);
    display:flex; flex-direction:column;
    z-index:3;
  }
  .roomie-wall[hidden]{display:none;}
  .roomie-wall-title{
    text-align:center;
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(8px, 1.6vw, 13px); letter-spacing:0.02em;
    color:var(--plum); text-transform:uppercase;
    margin-bottom:clamp(3px, 0.8vw, 7px);
  }
  .roomie-wall-title span{font-weight:600; color:var(--ink-soft); text-transform:none; letter-spacing:0;}
  .roomie-slots{
    flex:1;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:clamp(3px, 0.8vw, 8px);
    min-height:0;
  }
  .roomie-col{display:flex; flex-direction:column; align-items:center; gap:3px; min-height:0;}
  .roomie-col-label{
    font-family:'Baloo 2', sans-serif; font-weight:700;
    font-size:clamp(5.5px, 1.1vw, 8.5px); color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.02em;
    white-space:nowrap;
  }
  .roomie-col-slots{
    display:flex; gap:2px;
    width:100%; flex:1; min-height:0;
  }
  .roomie-slot{
    flex:1;
    aspect-ratio:1;
    background:#fff;
    border:1.5px dashed var(--line);
    border-radius:4px;
  }

  /* REVEAL CARD — pops up large and centered on the board, positioned
     near wherever the token currently is (not a bottom sheet). */
  .reveal-overlay{
    position:absolute; inset:0;
    background:rgba(42,32,51,0.32);
    border-radius:16px;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
  }
  .reveal-overlay.open{opacity:1; pointer-events:auto;}
  .reveal-card{
    position:absolute;
    width:62%;
    max-width:420px;
    background:#fff;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(42,32,51,0.4);
    padding:clamp(18px, 3.5vw, 30px) clamp(16px, 3vw, 26px);
    text-align:center;
    transform:translate(-50%, -50%) scale(0.85);
    opacity:0;
    transition:transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.25s ease;
    z-index:11;
  }
  .reveal-overlay.open .reveal-card{transform:translate(-50%, -50%) scale(1); opacity:1;}
  .reveal-icon{
    width:clamp(52px, 9vw, 72px); height:clamp(52px, 9vw, 72px);
    margin:0 auto 14px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
  }
  .reveal-icon svg{width:56%; height:56%;}
  .reveal-tag{
    display:inline-block;
    font-family:'Baloo 2', sans-serif; font-weight:700;
    font-size:11px; letter-spacing:0.04em; text-transform:uppercase;
    padding:4px 12px; border-radius:999px;
    margin-bottom:10px;
    color:#fff;
  }
  .reveal-title{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(17px, 3vw, 22px); color:var(--plum);
    margin-bottom:10px;
  }
  .reveal-text{
    font-size:clamp(14px, 2.4vw, 16.5px); line-height:1.55;
    color:var(--ink); margin-bottom:18px;
  }
  .reveal-action{
    background:var(--gold); color:var(--plum); border:0;
    padding:12px 28px; border-radius:10px;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:15px;
    cursor:pointer; transition:background 0.2s ease;
  }
  .reveal-action:hover{background:#FFC15A;}
  .reveal-action[hidden]{display:none;}
  .reveal-hint{font-size:12px; color:var(--ink-soft); margin-top:10px;}
  .reveal-icon.type-corner, .reveal-tag.type-corner{background:var(--plum-deep);}
  .reveal-icon.type-milestone, .reveal-tag.type-milestone{background:var(--teal);}
  .reveal-icon.type-setback, .reveal-tag.type-setback{background:var(--setback);}
  .reveal-icon.type-connection, .reveal-tag.type-connection{background:var(--blue);}
  .reveal-icon.type-collectible, .reveal-tag.type-collectible{background:var(--gold-deep);}
  .reveal-icon.type-story, .reveal-tag.type-story{background:var(--pink-deep);}
  .reveal-icon.type-finish, .reveal-tag.type-finish{background:linear-gradient(135deg, var(--gold), var(--gold-deep));}
</style>
</head>
<body>

<header class="game-header">
  <a href="index.html" class="game-brand">
    <img src="assets/apple-touch-icon.png" alt="FIRST PLACE ribbon logo">
    <span>FIRST PLACE</span>
  </a>
  <a href="index.html" class="game-home">← Home</a>
</header>

<div class="game-wrap">

  <!-- SCREEN 1: CHARACTER SELECT -->
  <section id="screen-select" class="game-screen">
    <h1 class="game-title">Choose Your Character</h1>
    <p class="game-sub">Pick who you're playing as — you'll follow their path to the dream.</p>
    <div class="select-stage">
      <img class="select-board-bg" src="assets/game/First_Place_Board_Assembly.png" alt="">
      <div class="char-grid">
        <button type="button" class="char-card" data-character="fran">
          <img src="assets/game/Fran-playing-piece.png" alt="Fran">
          <span class="char-name">Fran</span>
          <span class="char-dream">Record a bubblegum rap album — music video included.</span>
        </button>
        <button type="button" class="char-card" data-character="jeremy">
          <img src="assets/game/Jeremy-playing-piece.png" alt="Jeremy">
          <span class="char-name">Jeremy</span>
          <span class="char-dream">A ride-along with the cops of Cops.</span>
        </button>
        <button type="button" class="char-card" data-character="will">
          <img src="assets/game/Will-playing-piece.png" alt="Will">
          <span class="char-name">Will</span>
          <span class="char-dream">Write for Star Wars — even the fan fiction legends.</span>
        </button>
        <button type="button" class="char-card" data-character="martha">
          <img src="assets/game/Martha-playing-piece.png" alt="Martha">
          <span class="char-name">Martha</span>
          <span class="char-dream">A speaking tour across the US.</span>
        </button>
      </div>
    </div>
  </section>

  <!-- SCREEN 2: EMAIL GATE -->
  <section id="screen-gate" class="game-screen" hidden>
    <h1 class="game-title">Almost there</h1>
    <p class="game-sub" id="gate-sub">Enter your email to unlock the board.</p>
    <div class="gate-card">
      <div class="gate-picked" id="gate-picked"></div>
      <form class="gate-form" id="gate-form" method="post" action="https://app.kit.com/forms/9874369/subscriptions" novalidate>
        <input type="email" name="email_address" id="gate-email" placeholder="Your email" required aria-label="Email address">
        <button type="submit" id="gate-submit">Unlock</button>
      </form>
      <p class="gate-message" id="gate-message" hidden></p>
      <button type="button" class="gate-back" id="gate-back">← Pick a different character</button>
    </div>
  </section>

  <!-- SCREEN 3: BOARD — staging (pick up the die, roll, then the email
       gate) followed by the opening move once confirmed. -->
  <section id="screen-board" class="game-screen" hidden>
    <h1 class="game-title" id="board-title">The Board</h1>
    <p class="game-sub" id="board-sub">44 squares from Moving Day to the Dream, Realized.</p>

    <div class="board-frame" id="board-frame">
      <img class="board-image" src="assets/game/First_Place_Board_Assembly.png" alt="The First Place board — 44 squares from Moving Day to the Dream, Realized.">
      <img class="board-token" id="board-token" src="" alt="">

      <!--
        DICE POPPER PLACEHOLDER: plain shapes/CSS standing in for real
        "Pop-O-Matic" style dome art (like the popper in Trouble). Swap
        .dice-base/.dice-dome's CSS shapes for real art later — the
        click handler and roll logic don't need to change.
      -->
      <div class="dice-popper" id="dice-popper" hidden>
        <div class="click-callout" id="click-callout">CLICK ME</div>
        <div class="dice-base"></div>
        <button type="button" class="dice-dome" id="dice-dome" aria-label="Roll the die">
          <div class="die" id="die">
            <span class="pip tl"></span><span class="pip tc"></span><span class="pip tr"></span>
            <span class="pip ml"></span><span class="pip mc"></span><span class="pip mr"></span>
            <span class="pip bl"></span><span class="pip bc"></span><span class="pip br"></span>
          </div>
        </button>
      </div>

      <!--
        THE DOUBT'S POPPER: rolls automatically, paired with the
        player's roll — not clickable. Placeholder shapes, same as the
        player's popper, themed dark (black die, white pips).
      -->
      <div class="dice-popper doubt-popper" id="doubt-popper" hidden>
        <div class="dice-base doubt-base"></div>
        <div class="dice-dome doubt-dome" id="doubt-dome" aria-hidden="true">
          <div class="die doubt-die" id="doubt-die">
            <span class="pip tl"></span><span class="pip tc"></span><span class="pip tr"></span>
            <span class="pip ml"></span><span class="pip mc"></span><span class="pip mr"></span>
            <span class="pip bl"></span><span class="pip bc"></span><span class="pip br"></span>
          </div>
        </div>
      </div>
      <img class="board-token doubt-token" id="doubt-token" src="assets/game/A-Doubt-playing-piece.png" alt="The Doubt" hidden>

      <!--
        ROOMIE WALL: visual home for the Roomie collection system.
        Covers the mug-and-keys illustration baked into the board image
        once the first roll happens; the logo/tagline above are higher
        up in the image and untouched. Slots stay empty placeholders
        until Roomie collection itself is built.
      -->
      <div class="roomie-wall" id="roomie-wall" hidden>
        <div class="roomie-wall-title">Roomie Wall <span>— collect them all</span></div>
        <div class="roomie-slots" id="roomie-slots"></div>
      </div>

      <div class="reveal-overlay" id="reveal-overlay">
        <div class="reveal-card" id="reveal-card">
          <div class="reveal-icon" id="reveal-icon"></div>
          <span class="reveal-tag" id="reveal-tag"></span>
          <div class="reveal-title" id="reveal-title"></div>
          <p class="reveal-text" id="reveal-text"></p>
          <button type="button" class="reveal-action" id="reveal-action" hidden></button>
          <p class="reveal-hint" id="reveal-hint" hidden>Continuing…</p>
        </div>
      </div>
    </div>

    <p class="roll-result" id="roll-result" hidden></p>
    <p class="pacing-note" id="pacing-note" hidden></p>
    <p class="board-caption"><button type="button" id="change-character">Change character</button></p>
  </section>

</div>

<script>
(function () {
  var EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  var CHARACTERS = {
    fran:   { name: 'Fran',   token: 'assets/game/Fran-playing-piece.png' },
    jeremy: { name: 'Jeremy', token: 'assets/game/Jeremy-playing-piece.png' },
    will:   { name: 'Will',   token: 'assets/game/Will-playing-piece.png' },
    martha: { name: 'Martha', token: 'assets/game/Martha-playing-piece.png' }
  };

  // Full 44-square board, transcribed from first-place-board-game-
  // design.md. Kept here purely as data (not rendered — the board image
  // already shows the art) so landing effects can be resolved: "Advance
  // N" / "Move back N" / "Lose a turn". Story-beat squares carry
  // per-character text; no numeric effect on them per the design doc
  // ("pure narrative momentum").
  var BOARD_SQUARES = [
    { n: 1, type: 'corner', label: 'START', text: 'Boxes everywhere, keys in hand. The journey begins.' },
    { n: 2, type: 'milestone', text: 'Job interview — nailed it. Advance 2.' },

    { n: 13, type: 'setback', text: 'Lost the scissors. Again. Lose a turn.' },
    { n: 14, type: 'milestone', text: 'First paycheck. Advance 2.' },
    { n: 15, type: 'collectible', text: 'Find a Roomie!' },

    { n: 19, type: 'story', text: { fran: 'Found the right beat.', jeremy: 'Ride-along date confirmed.', will: "Invited into the writers' room chat.", martha: 'Second city added to the tour.' } },
    { n: 20, type: 'setback', text: 'Got a little lost walking home. Move back 2.' },
    { n: 21, type: 'milestone', text: 'Aced your budget this month. Advance 2.' },
    { n: 22, type: 'connection', text: "Tag a friend who'd love this show. Advance 3." },
    { n: 23, type: 'corner', label: 'ROOMIE GATE', text: "Need at least 2 Roomies collected to pass. Don't have them? Head back and keep looking." },
    { n: 24, type: 'milestone', text: "Learned to cook something that wasn't cereal. Advance 2." },
    { n: 25, type: 'setback', text: 'Spilled coffee on your only clean shirt. Move back 1.' },
    { n: 26, type: 'collectible', text: 'Find a Roomie!' },
    { n: 27, type: 'connection', text: 'Leave a comment/review somewhere. Advance 3.' },
    { n: 28, type: 'setback', text: "Alarm didn't go off. Move back 2." },
    { n: 29, type: 'milestone', text: 'Got a compliment from your boss. Advance 2.' },
    { n: 30, type: 'story', text: { fran: 'Recorded the hook.', jeremy: 'Vest fitted, radio clipped on.', will: 'First pages sent for notes.', martha: 'Ticket sales open.' } },
    { n: 31, type: 'setback', text: 'Tripped in front of the cute neighbor. Lose a turn.' },
    { n: 32, type: 'milestone', text: 'Walked to the store alone, no big deal. Advance 2.' },
    { n: 33, type: 'connection', text: 'Recommend the show to a coworker. Advance 3.' },
    { n: 34, type: 'corner', label: 'FINAL STRETCH', text: "The dream's almost in reach." },
    { n: 35, type: 'milestone', text: 'Found your favorite coffee shop. Advance 2.' },
    { n: 36, type: 'setback', text: 'Forgot your umbrella. Move back 1.' },
    { n: 37, type: 'collectible', text: 'Find a Roomie!' },
    { n: 38, type: 'connection', text: 'Text a friend "guess what I\'m doing." Advance 3.' },
    { n: 39, type: 'setback', text: 'Roommate drama, round 2. Move back 2.' },
    { n: 40, type: 'milestone', text: 'Hit a personal goal you set for yourself. Advance 2.' },
    { n: 41, type: 'story', text: { fran: 'The beat drops.', jeremy: 'Radio call comes in — go time.', will: 'The whiteboard fills up.', martha: 'The arena lights come up.' } },
    { n: 42, type: 'setback', text: 'One more thing goes wrong, because life. Lose a turn.' },
    { n: 43, type: 'connection', text: 'Share your board one more time. Advance 3.' },
    { n: 44, type: 'finish', label: 'FINISH', text: 'The Dream, Realized.' }
  ];
  var BOARD_BY_N = {};
  BOARD_SQUARES.forEach(function (sq) { BOARD_BY_N[sq.n] = sq; });

  function squareText(sq, characterKey) {
    return typeof sq.text === 'object' ? sq.text[characterKey] : sq.text;
  }

  // "Only the square you land on via your move/spin triggers its effect.
  // If that effect moves your token again... the destination square's
  // own effect does NOT re-trigger" — first-place-board-game-design.md.
  //
  // Deliberately NOT yet implemented (both require systems that don't
  // exist yet and are still explicitly deferred to follow-up prompts):
  // - Collectible squares ("Find a Roomie!") don't award anything —
  //   there's no Roomie inventory yet.
  // - The Roomie Gate (Square 23) doesn't check/enforce the "need 2
  //   Roomies to pass" rule — enforcing it now, with no way to ever
  //   collect one, would permanently soft-lock the board.
  function resolveLanding(square, characterKey) {
    var sq = BOARD_BY_N[square];
    var text = sq ? (squareText(sq, characterKey) || '') : '';
    var loseTurn = /Lose a turn/i.test(text);
    var advanceMatch = /Advance (\d+)/.exec(text);
    var backMatch = /Move back (\d+)/.exec(text);
    var finalSquare = square;
    if (advanceMatch) finalSquare = Math.min(44, square + parseInt(advanceMatch[1], 10));
    else if (backMatch) finalSquare = Math.max(1, square - parseInt(backMatch[1], 10));
    return {
      landedSquare: square,
      landedType: sq ? sq.type : null,
      landedLabel: sq ? sq.label : null,
      finalSquare: finalSquare,
      loseTurn: loseTurn,
      landedText: text
    };
  }

  var TYPE_LABEL = {
    corner: 'Corner',
    milestone: 'Milestone',
    setback: 'Setback',
    connection: 'Connection',
    collectible: 'Collectible',
    story: 'Story Beat',
    finish: 'Finish'
  };

  // Larger versions of the same icon language used elsewhere on this
  // page (e.g. the type-swatch idea from the board's very first pass),
  // sized up for the reveal card's prominent top icon.
  var TYPE_ICON = {
    corner: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18"/><path d="M5 4h13l-2 4 2 4H5"/></svg>',
    milestone: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.6 6.8L12 16.9 5.8 20.4l1.6-6.8L2.2 9l6.9-.7z"/></svg>',
    setback: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18L18 6M6 6l12 12"/></svg>',
    connection: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="12" r="2.3"/><circle cx="17" cy="6" r="2.3"/><circle cx="17" cy="18" r="2.3"/><path d="M9 11l6-4M9 13l6 4"/></svg>',
    collectible: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1"/><path d="M4 13h16M12 9v11M8 9c0-2 1.5-4 4-4s4 2 4 4"/></svg>',
    story: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 9 9 0 0 1-4-.9L3 20l1.1-4a8.4 8.4 0 0 1-1.1-4.5 8.4 8.4 0 0 1 8.9-8.4 8.6 8.6 0 0 1 9.1 8.4z"/></svg>',
    finish: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v18"/><path d="M6 4h4l1 2h7l-2 4 2 4h-7l-1-2H6"/></svg>'
  };

  // Perimeter walk matching the actual board art (First_Place_Board_
  // Assembly.png), measured directly from the image: a precise 12x12
  // grid of 220px cells. Square 1 (START) is the BOTTOM-RIGHT corner;
  // numbers run 1-12 right-to-left along the bottom, 12-23 bottom-to-top
  // up the left side, 23-34 left-to-right along the top, 34-44 top-to-
  // bottom down the right side back toward square 1. (col,row) are
  // 1-indexed grid cells, row 1 = top.
  function squarePosition(n) {
    if (n <= 12) return { col: 13 - n, row: 12 };
    if (n <= 23) return { col: 1, row: 24 - n };
    if (n <= 34) return { col: n - 22, row: 1 };
    return { col: 12, row: n - 33 };
  }

  var CELL_PCT = 100 / 12;

  // Staging spot (top-center, clear of both dice) and the two dice
  // poppers' spots — player's on the left, The Doubt's mirrored on the
  // right — all in the board's open center.
  var STAGE_POS = { left: 50, bottom: 76 };
  var DICE_POS = { left: 22, bottom: 56 };
  var DOUBT_DICE_POS = { left: 78, bottom: 56 };

  function cellPercent(n) {
    var pos = squarePosition(n);
    return { left: (pos.col - 1 + 0.5) * CELL_PCT, bottom: 100 - pos.row * CELL_PCT };
  }

  function placeTokenAt(leftPct, bottomPct) {
    var token = document.getElementById('board-token');
    token.style.left = leftPct + '%';
    token.style.bottom = bottomPct + '%';
  }

  function placeToken(n) {
    var p = cellPercent(n);
    placeTokenAt(p.left, p.bottom);
  }

  function placeDoubtToken(n) {
    var p = cellPercent(n);
    var token = document.getElementById('doubt-token');
    token.style.left = p.left + '%';
    token.style.bottom = p.bottom + '%';
  }

  function getDoubtSquare() {
    return parseInt(localStorage.getItem('doubtSquare') || '1', 10);
  }
  function setDoubtSquare(n) {
    localStorage.setItem('doubtSquare', String(n));
  }

  function positionDicePopper() {
    var popper = document.getElementById('dice-popper');
    popper.style.left = DICE_POS.left + '%';
    popper.style.bottom = DICE_POS.bottom + '%';
  }

  function positionDoubtDicePopper() {
    var popper = document.getElementById('doubt-popper');
    popper.style.left = DOUBT_DICE_POS.left + '%';
    popper.style.bottom = DOUBT_DICE_POS.bottom + '%';
  }

  // Reveal card: centered near wherever the token landed, clamped so
  // its box (62% wide, roughly half that tall) never runs off the board.
  function positionRevealCard(square) {
    var p = cellPercent(square);
    var leftPct = Math.max(31, Math.min(69, p.left));
    var topPct = Math.max(24, Math.min(76, 100 - p.bottom));
    var card = document.getElementById('reveal-card');
    card.style.left = leftPct + '%';
    card.style.top = topPct + '%';
  }

  var screens = {
    select: document.getElementById('screen-select'),
    gate: document.getElementById('screen-gate'),
    board: document.getElementById('screen-board')
  };

  function showScreen(name) {
    Object.keys(screens).forEach(function (k) { screens[k].hidden = (k !== name); });
    window.scrollTo(0, 0);
  }

  function getCharacterKey() {
    var key = localStorage.getItem('gameCharacter');
    return CHARACTERS[key] ? key : null;
  }

  function resetGameProgress() {
    localStorage.removeItem('gameCharacter');
    localStorage.removeItem('gameSquare');
    localStorage.removeItem('pendingRoll');
    localStorage.removeItem('gameLoseTurn');
    localStorage.removeItem('doubtSquare');
    localStorage.removeItem('pendingDoubtRoll');
  }

  // ---------- Screen 1: character select ----------
  document.querySelectorAll('.char-card').forEach(function (card) {
    card.addEventListener('click', function () {
      var key = card.getAttribute('data-character');
      localStorage.setItem('gameCharacter', key);
      localStorage.removeItem('gameSquare');
      localStorage.removeItem('pendingRoll');
      localStorage.removeItem('gameLoseTurn');
      localStorage.removeItem('doubtSquare');
      localStorage.removeItem('pendingDoubtRoll');
      enterStaging();
    });
  });

  // ---------- Screen 3 (part 1): staging — token parked center-right,
  // dice popper center-left, waiting for a roll ----------
  function enterStaging() {
    var key = getCharacterKey();
    var c = CHARACTERS[key];

    document.getElementById('board-title').textContent = 'Roll to Begin';
    document.getElementById('board-sub').textContent = "Tap the die to see how far " + c.name + ' starts.';

    var token = document.getElementById('board-token');
    token.src = c.token;
    token.alt = c.name + "'s token";
    token.classList.remove('drop-in');
    placeTokenAt(STAGE_POS.left, STAGE_POS.bottom);
    void token.offsetWidth; // restart the drop-in animation on repeat visits
    token.classList.add('drop-in');

    positionDicePopper();
    document.getElementById('dice-popper').hidden = false;
    document.getElementById('dice-dome').disabled = false;
    document.getElementById('click-callout').classList.remove('hide');
    setDieFace(1);
    document.getElementById('roll-result').hidden = true;
    document.getElementById('pacing-note').hidden = true;

    // The Doubt rolls paired with the player from the very first roll —
    // its popper is visible from staging onward. Its token and the
    // Roomie Wall only appear once there's an actual position to show
    // (i.e. after that first roll resolves).
    positionDoubtDicePopper();
    document.getElementById('doubt-popper').hidden = false;
    setDoubtDieFace(1);
    document.getElementById('doubt-token').hidden = true;
    document.getElementById('roomie-wall').hidden = true;

    showScreen('board');
  }

  // ---------- Dice popper ----------
  var DIE_FACES = {
    1: ['mc'],
    2: ['tl', 'br'],
    3: ['tl', 'mc', 'br'],
    4: ['tl', 'tr', 'bl', 'br'],
    5: ['tl', 'tr', 'mc', 'bl', 'br'],
    6: ['tl', 'tr', 'ml', 'mr', 'bl', 'br']
  };
  var PIP_CLASSES = ['tl', 'tc', 'tr', 'ml', 'mc', 'mr', 'bl', 'bc', 'br'];

  function setDieFace(n) {
    var die = document.getElementById('die');
    var on = DIE_FACES[n] || [];
    PIP_CLASSES.forEach(function (cls) {
      die.querySelector('.pip.' + cls).classList.toggle('visible', on.indexOf(cls) !== -1);
    });
  }

  function setDoubtDieFace(n) {
    var die = document.getElementById('doubt-die');
    var on = DIE_FACES[n] || [];
    PIP_CLASSES.forEach(function (cls) {
      die.querySelector('.pip.' + cls).classList.toggle('visible', on.indexOf(cls) !== -1);
    });
  }

  // Pacing is deliberately a soft nudge, not a hard cap — the design doc
  // says "a few moves per visit... fine if someone finishes in one
  // sitting," so rolling is never actually blocked, just gently flagged
  // once someone's put in a solid session.
  var PACING_NUDGE_THRESHOLD = 6;

  function recordRollForPacing() {
    var today = new Date().toISOString().slice(0, 10);
    var count = parseInt(localStorage.getItem('gameRollsToday') || '0', 10);
    if (localStorage.getItem('gameRollDate') !== today) {
      count = 0;
      localStorage.setItem('gameRollDate', today);
    }
    count += 1;
    localStorage.setItem('gameRollsToday', String(count));
    return count;
  }

  function showPacingNoticeIfNeeded() {
    var count = parseInt(localStorage.getItem('gameRollsToday') || '0', 10);
    var note = document.getElementById('pacing-note');
    if (count === PACING_NUDGE_THRESHOLD) {
      note.textContent = "You've made " + count + ' moves today — keep going, or come back tomorrow for more!';
      note.hidden = false;
    }
  }

  // The die is a persistent control, not a one-time intro piece: the
  // very first roll (pre-gate) goes through onRollComplete(); every
  // roll after that (once gameSquare exists) is a normal turn handled
  // by rollForTurn() — same popper, same animation, no gate involved.
  document.getElementById('dice-dome').addEventListener('click', function () {
    var dome = this;
    if (dome.disabled) return;
    dome.disabled = true;
    document.getElementById('click-callout').classList.add('hide');
    document.getElementById('pacing-note').hidden = true;

    var die = document.getElementById('die');
    var doubtDie = document.getElementById('doubt-die');
    die.classList.add('rolling');
    doubtDie.classList.add('rolling');

    // The Doubt rolls automatically, paired with the player — no
    // separate click, both dice tumble at once and settle together.
    var ticks = 0;
    var maxTicks = 9;
    var tickInterval = setInterval(function () {
      setDieFace(1 + Math.floor(Math.random() * 6));
      setDoubtDieFace(1 + Math.floor(Math.random() * 6));
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(tickInterval);
        var result = 1 + Math.floor(Math.random() * 6);
        var doubtResult = 1 + Math.floor(Math.random() * 6);
        setDieFace(result);
        setDoubtDieFace(doubtResult);
        die.classList.remove('rolling');
        doubtDie.classList.remove('rolling');
        localStorage.setItem('pendingDoubtRoll', String(doubtResult));
        if (localStorage.getItem('gameSquare')) {
          rollForTurn(result);
        } else {
          onRollComplete(result);
        }
      }
    }, 90);
  });

  function onRollComplete(result) {
    recordRollForPacing();
    localStorage.setItem('pendingRoll', String(result));

    var resultEl = document.getElementById('roll-result');
    resultEl.textContent = 'You rolled a ' + result + '!';
    resultEl.hidden = false;

    // Always show the gate after the very first roll — don't shortcut
    // on the generic site-wide hasEnteredEmail flag here, since that
    // just means "this device confirmed some email once before," not
    // "the email this player is about to type is confirmed." The gate
    // form's own /api/check-subscriber check (below) is what correctly
    // verifies the ACTUAL email typed in, and skips straight through
    // when that one is already confirmed.
    window.setTimeout(function () {
      var key = getCharacterKey();
      var c = CHARACTERS[key];
      document.getElementById('gate-sub').textContent =
        'Enter your email to move ' + c.name + ' through the game.';
      renderGatePicked();
      showScreen('gate');
    }, 900);
  }

  // ---------- Screen 2: email gate (reuses the site's existing
  // confirmed-subscriber check + Kit double opt-in flow), now shown
  // AFTER the pre-game roll rather than before it ----------
  function renderGatePicked() {
    var key = getCharacterKey();
    var el = document.getElementById('gate-picked');
    if (!key) { el.innerHTML = ''; return; }
    var c = CHARACTERS[key];
    el.innerHTML = '<img src="' + c.token + '" alt="' + c.name + '"><span>Playing as ' + c.name + '</span>';
  }

  document.getElementById('gate-back').addEventListener('click', function () {
    resetGameProgress();
    showScreen('select');
  });

  (function initGate() {
    var form = document.getElementById('gate-form');
    var emailInput = document.getElementById('gate-email');
    var submitBtn = document.getElementById('gate-submit');
    var messageEl = document.getElementById('gate-message');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = emailInput.value.trim();

      messageEl.hidden = true;
      emailInput.classList.remove('invalid');

      if (!email || !EMAIL_PATTERN.test(email)) {
        messageEl.textContent = 'Please enter a valid email address.';
        messageEl.className = 'gate-message error';
        messageEl.hidden = false;
        emailInput.classList.add('invalid');
        emailInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Checking…';

      // Same fast path as the homepage/shop gates: an already-confirmed
      // Kit subscriber skips straight through, no email needed — the
      // roll we already have just counts immediately.
      fetch('/api/check-subscriber', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      })
        .then(function (res) { return res.ok ? res.json() : { confirmed: false }; })
        .catch(function () { return { confirmed: false }; })
        .then(function (data) {
          if (data && data.confirmed) {
            localStorage.setItem('hasEnteredEmail', 'true');
            completeOpeningMove();
            return;
          }

          var formData = new FormData();
          formData.append('email_address', email);

          // So confirmed.html knows to bounce back here (instead of its
          // shop.html default) once this visitor clicks the confirmation
          // link in Kit's email. pendingRoll is already in localStorage,
          // so the roll survives that round trip and still counts.
          localStorage.setItem('pendingGateReturn', 'game.html');

          return fetch(form.action, {
            method: 'POST',
            headers: { 'Accept': 'application/json' },
            body: formData
          }).then(function (res) {
            if (!res.ok) throw new Error('Submission failed');
            localStorage.setItem('hasEnteredEmail', 'true');
            form.hidden = true;
            messageEl.textContent = 'Check your email to come on in.';
            messageEl.className = 'gate-message success';
            messageEl.hidden = false;
          });
        })
        .catch(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Unlock';
          messageEl.textContent = 'Something went wrong — please try again.';
          messageEl.className = 'gate-message error';
          messageEl.hidden = false;
        });
    });
  })();

  // ---------- Reveal card: pops up large, centered near the token,
  // large icon on top, clear copy below. Resolve behavior by type:
  // milestone/setback/story/corner/finish auto-continue; connection
  // needs an honor-system "Confirm" (per the design doc's verification
  // rule); collectible needs a "Reveal" tap. Visual redesign only —
  // does not change which squares do what, just how landing on one
  // is shown and (for connection/collectible) confirmed. ----------
  function showRevealCard(outcome, characterKey, onDone) {
    var type = outcome.landedType || 'milestone';
    var icon = document.getElementById('reveal-icon');
    var tag = document.getElementById('reveal-tag');
    var title = document.getElementById('reveal-title');
    var text = document.getElementById('reveal-text');
    var action = document.getElementById('reveal-action');
    var hint = document.getElementById('reveal-hint');
    var overlay = document.getElementById('reveal-overlay');

    icon.className = 'reveal-icon type-' + type;
    icon.innerHTML = TYPE_ICON[type] || '';
    tag.className = 'reveal-tag type-' + type;
    tag.textContent = TYPE_LABEL[type] || '';
    title.textContent = outcome.landedLabel || ('Square ' + outcome.landedSquare);
    text.textContent = outcome.landedText || '';

    positionRevealCard(outcome.landedSquare);

    var closed = false;
    function closeAndDone() {
      if (closed) return;
      closed = true;
      overlay.classList.remove('open');
      window.setTimeout(onDone, 260); // let the close transition play first
    }

    if (type === 'connection') {
      action.hidden = false;
      action.textContent = 'Confirm';
      hint.hidden = true;
      action.onclick = closeAndDone;
    } else if (type === 'collectible') {
      action.hidden = false;
      action.textContent = 'Reveal';
      hint.hidden = true;
      action.onclick = closeAndDone;
    } else {
      action.hidden = true;
      action.onclick = null;
      hint.hidden = false;
      hint.textContent = 'Continuing…';
      window.setTimeout(closeAndDone, 1800);
    }

    overlay.classList.add('open');
  }

  // ---------- The Doubt: rolls paired with the player (see the shared
  // click handler above), then moves once the player's landing type is
  // known — baseline creep + the new die roll + setback/connection
  // modifiers, all additive per the follow-up clarification. Checks the
  // catch condition against the player's own final square. ----------
  function resolveDoubtTurn(playerOutcome, doubtRoll, onDone) {
    var doubtFrom = getDoubtSquare();
    var modifier = playerOutcome.landedType === 'setback' ? 1
      : (playerOutcome.landedType === 'connection' ? -2 : 0);
    var doubtMove = 1 + doubtRoll + modifier; // 1 = existing baseline creep
    var doubtTo = Math.max(1, Math.min(44, doubtFrom + doubtMove));

    window.setTimeout(function () {
      placeDoubtToken(doubtTo);
      setDoubtSquare(doubtTo);

      if (doubtTo >= playerOutcome.finalSquare) {
        // Caught: player resets to Square 1, Roomies kept (n/a — not
        // built yet), Doubt resets to its starting distance behind.
        window.setTimeout(function () {
          localStorage.setItem('gameSquare', '1');
          setDoubtSquare(1);
          placeToken(1);
          placeDoubtToken(1);
          var resultEl = document.getElementById('roll-result');
          resultEl.textContent = 'The Doubt caught you — back to Square 1. (Any Roomies collected are kept.)';
          resultEl.hidden = false;
          window.setTimeout(onDone, 1200);
        }, 500);
      } else {
        if (!localStorage.getItem('gameSquare') || parseInt(localStorage.getItem('gameSquare'), 10) !== playerOutcome.finalSquare) {
          localStorage.setItem('gameSquare', String(playerOutcome.finalSquare));
        }
        onDone();
      }
    }, 300);
  }

  function finishTurnUI() {
    localStorage.removeItem('pendingRoll');
    localStorage.removeItem('pendingDoubtRoll');
    var finalSq = parseInt(localStorage.getItem('gameSquare') || '1', 10);
    document.getElementById('board-sub').textContent = 'Square ' + finalSq + ' of 44.';
    showPacingNoticeIfNeeded();
    document.getElementById('dice-dome').disabled = (finalSq >= 44);
  }

  function completeOpeningMove() {
    var key = getCharacterKey();
    var c = CHARACTERS[key];
    var roll = parseInt(localStorage.getItem('pendingRoll') || '1', 10);
    var doubtRoll = parseInt(localStorage.getItem('pendingDoubtRoll') || '1', 10);
    var rolledSquare = 1 + roll;
    var outcome = resolveLanding(rolledSquare, key);

    document.getElementById('board-title').textContent = 'The Board — Playing as ' + c.name;
    document.getElementById('board-sub').textContent = "You're on your way!";
    document.getElementById('roll-result').hidden = true;
    document.getElementById('click-callout').classList.add('hide');

    var token = document.getElementById('board-token');
    token.src = c.token;
    token.alt = c.name + "'s token";
    token.classList.remove('drop-in');
    placeTokenAt(STAGE_POS.left, STAGE_POS.bottom);

    // Both poppers, the Doubt's token, and the Roomie Wall are all
    // permanent fixtures from here on — not one-time intro pieces.
    positionDicePopper();
    document.getElementById('dice-popper').hidden = false;
    positionDoubtDicePopper();
    document.getElementById('doubt-popper').hidden = false;
    document.getElementById('doubt-token').hidden = false;
    placeDoubtToken(getDoubtSquare());
    showRoomieWall();

    showScreen('board');

    window.setTimeout(function () {
      placeToken(1); // staging -> Square 1
      window.setTimeout(function () {
        placeToken(rolledSquare); // the roll itself
        window.setTimeout(function () {
          showRevealCard(outcome, key, function () {
            var afterEffect = function () {
              resolveDoubtTurn(outcome, doubtRoll, function () {
                finishTurnUI();
              });
            };
            if (outcome.finalSquare !== rolledSquare) {
              window.setTimeout(function () {
                placeToken(outcome.finalSquare); // that square's own effect firing
                window.setTimeout(afterEffect, 500);
              }, 200);
            } else {
              afterEffect();
            }
          });
        }, 500);
      }, 700);
    }, 250);
  }

  // ---------- A normal turn, once the player already has a board
  // position: click the same popper, roll, advance from wherever they
  // currently are, resolve that landing square's effect. No gate. ----------
  function rollForTurn(roll) {
    var key = getCharacterKey();
    var doubtRoll = parseInt(localStorage.getItem('pendingDoubtRoll') || '1', 10);
    var from = parseInt(localStorage.getItem('gameSquare') || '1', 10);

    if (from >= 44) {
      var doneEl = document.getElementById('roll-result');
      doneEl.textContent = "You've already reached the Dream, Realized!";
      doneEl.hidden = false;
      document.getElementById('dice-dome').disabled = true;
      localStorage.removeItem('pendingDoubtRoll');
      return;
    }

    recordRollForPacing();

    var landedSquare = Math.min(44, from + roll); // cap at Finish, never overshoot
    var outcome = resolveLanding(landedSquare, key);

    document.getElementById('roll-result').hidden = true;

    window.setTimeout(function () {
      placeToken(landedSquare);
      window.setTimeout(function () {
        showRevealCard(outcome, key, function () {
          var afterEffect = function () {
            resolveDoubtTurn(outcome, doubtRoll, function () {
              finishTurnUI();
            });
          };
          if (outcome.finalSquare !== landedSquare) {
            window.setTimeout(function () {
              placeToken(outcome.finalSquare);
              window.setTimeout(afterEffect, 500);
            }, 200);
          } else {
            afterEffect();
          }
        });
      }, 500);
    }, 150);
  }

  // ---------- Roomie Wall — visual home for the (not-yet-built) Roomie
  // collection system. Appears once the first roll happens, replacing
  // the mug-and-keys art baked into the board image at that spot. 16
  // empty slots, 4 per character; the logo/tagline above are untouched
  // since they're higher up in the image, outside this overlay's area. ----------
  function showRoomieWall() {
    buildRoomieWallOnce();
    document.getElementById('roomie-wall').hidden = false;
  }

  function buildRoomieWallOnce() {
    var container = document.getElementById('roomie-slots');
    if (container.children.length) return;
    ['fran', 'jeremy', 'will', 'martha'].forEach(function (charKey) {
      var col = document.createElement('div');
      col.className = 'roomie-col';

      var label = document.createElement('div');
      label.className = 'roomie-col-label';
      label.textContent = CHARACTERS[charKey].name;
      col.appendChild(label);

      var slots = document.createElement('div');
      slots.className = 'roomie-col-slots';
      for (var i = 0; i < 4; i++) {
        var slot = document.createElement('div');
        slot.className = 'roomie-slot';
        slots.appendChild(slot);
      }
      col.appendChild(slots);

      container.appendChild(col);
    });
  }

  // ---------- Settled board view (returning to /game after at least
  // one move) — token at their current square, dice popper active and
  // ready for their next turn. ----------
  function renderSettledBoard(squareNum) {
    var key = getCharacterKey();
    var c = CHARACTERS[key];

    document.getElementById('board-title').textContent = 'The Board — Playing as ' + c.name;
    document.getElementById('board-sub').textContent = 'Square ' + squareNum + ' of 44.';
    document.getElementById('roll-result').hidden = true;
    document.getElementById('pacing-note').hidden = true;

    var token = document.getElementById('board-token');
    token.src = c.token;
    token.alt = c.name + "'s token";
    token.classList.remove('drop-in');
    placeToken(squareNum);
    void token.offsetWidth;
    token.classList.add('drop-in');

    positionDicePopper();
    document.getElementById('dice-popper').hidden = false;
    document.getElementById('dice-dome').disabled = (squareNum >= 44);
    document.getElementById('click-callout').classList.add('hide'); // already introduced once
    setDieFace(1);

    positionDoubtDicePopper();
    document.getElementById('doubt-popper').hidden = false;
    setDoubtDieFace(1);
    document.getElementById('doubt-token').hidden = false;
    placeDoubtToken(getDoubtSquare());

    showRoomieWall();

    showScreen('board');
  }

  document.getElementById('change-character').addEventListener('click', function () {
    resetGameProgress();
    showScreen('select');
  });

  // ---------- Initial screen on load ----------
  var storedCharacter = getCharacterKey();
  var storedSquare = localStorage.getItem('gameSquare');
  var storedPendingRoll = localStorage.getItem('pendingRoll');
  var confirmed = localStorage.getItem('hasEnteredEmail') === 'true';

  if (!storedCharacter) {
    showScreen('select');
  } else if (storedSquare) {
    renderSettledBoard(parseInt(storedSquare, 10));
  } else if (storedPendingRoll && confirmed) {
    // Rolled already, then confirmed (via Kit's email round trip, or
    // was already confirmed elsewhere) — finish the move that was
    // waiting on the gate.
    completeOpeningMove();
  } else {
    enterStaging();
  }
})();
</script>
